name: flutter_maps_nativo
description: "Projeto Flutter para obtenção de coordenadas usando Flutter Map."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

dependency_overrides:
  path_provider_foundation: 2.5.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"